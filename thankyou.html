<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Berhasil — INFRAME.STUDIO</title>
    <style>
        body {
            margin: 0;
            background: #F6F1E7;
            font-family: 'Manrope', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 40px 30px;
            max-width: 420px;
            border: 1px solid #E1D7C4;
            position: relative;
        }
        .card .corner {
            position: absolute;
            width: 16px;
            height: 16px;
            border-color: #96733F;
            border-style: solid;
            opacity: 0.85;
        }
        .card .tl { top: -1px; left: -1px; border-width: 1.5px 0 0 1.5px; }
        .card .tr { top: -1px; right: -1px; border-width: 1.5px 1.5px 0 0; }
        .card .bl { bottom: -1px; left: -1px; border-width: 0 0 1.5px 1.5px; }
        .card .br { bottom: -1px; right: -1px; border-width: 0 1.5px 1.5px 0; }

        h1 { font-family: 'Fraunces', serif; color: #211D17; }
        .gold { color: #96733F; }
        p { color: #6E665A; line-height: 1.7; }
        .btn-wa {
            display: inline-block;
            padding: 14px 26px;
            background: #211D17;
            color: #F6F1E7;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            margin-top: 10px;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="corner tl"></span>
        <span class="corner tr"></span>
        <span class="corner bl"></span>
        <span class="corner br"></span>

        <h1>✅ Booking Dikirim!</h1>
        <p>Terima kasih sudah mengisi form booking.</p>
        <p style="font-size: 13px;">Klik tombol di bawah untuk <strong>konfirmasi via WhatsApp</strong> agar booking-mu segera diproses.</p>

        <a href="https://wa.me/6288214960053?text=Halo%20INFRAME.STUDIO%2C%20saya%20sudah%20isi%20form%20booking%2C%20mohon%20konfirmasi%20ya." class="btn-wa">
            💬 Konfirmasi via WhatsApp
        </a>

        <p style="font-size: 12px; margin-top: 20px; color: #A69B87;">
            Nomor WhatsApp owner: 0882-1496-0053
        </p>
    </div>
</body>
</html>
